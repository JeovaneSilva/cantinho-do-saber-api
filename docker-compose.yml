version: '3.8'

services:
  mysql_db:
    image: mysql:8.0
    container_name: cantinho_do_saber_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cantinho_escolar
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: